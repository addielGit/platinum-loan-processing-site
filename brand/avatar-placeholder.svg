<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Generic profile photo placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <clipPath id="circle">
      <circle cx="80" cy="80" r="80" />
    </clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="160" height="160" fill="url(#bg)" />
    <!-- shoulders -->
    <path d="M80 96c-27 0-49 17.5-54.5 42.2A80 80 0 0 0 80 160a80 80 0 0 0 54.5-21.8C129 113.5 107 96 80 96Z" fill="#94a3b8" />
    <!-- head -->
    <circle cx="80" cy="64" r="30" fill="#94a3b8" />
    <!-- subtle rim so it reads as a photo placeholder, not an icon -->
    <circle cx="80" cy="80" r="78" fill="none" stroke="#64748b" stroke-opacity="0.35" stroke-width="4" />
  </g>
</svg>